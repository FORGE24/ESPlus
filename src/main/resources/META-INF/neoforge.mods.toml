modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="ESPlus Contributors"
description='''
ESPlus is a server-side security suite for NeoForge 1.21.1+.
It adds OP sudo password protection, protected command gating,
full audit logging, player movement tracking, item traceability,
anomaly alerts, chat moderation, and an embedded admin panel.

The project is licensed under LGPL-3.0-or-later.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
