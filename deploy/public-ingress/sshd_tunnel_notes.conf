# Snippets for /etc/ssh/sshd_config on the public VPS.
# Goal: allow RemoteForward only to localhost; do not publish GatewayPorts.

AllowTcpForwarding remote
GatewayPorts no
# Optional: restrict which user may open the reverse tunnel
# Match User seminecraft-tunnel
#     AllowTcpForwarding remote
#     ForceCommand /bin/false
#     PermitTTY no
