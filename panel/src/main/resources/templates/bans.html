<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('封禁名单 - ES+')}"></head>
<body>
<div th:replace="~{fragments/layout :: top}"></div>
<div class="container">
  <div th:replace="~{fragments/layout :: sidebar('bans')}"></div>
  <main class="main-content">
    <div class="page-heading">
      <h2>封禁名单</h2>
      <p>同步自游戏原版 banned-players。临时封禁到期后由服务端自动移除。</p>
    </div>
    <meta http-equiv="refresh" content="15"/>
    <p th:if="${msg != null}" class="flash-ok">已提交解封请求。</p>
    <p th:if="${err != null}" class="flash-err">操作失败。</p>
    <div class="card">
      <div class="card-title">当前封禁</div>
      <div class="card-body">
        <table>
          <thead><tr><th>名称</th><th>UUID</th><th>原因</th><th>来源</th><th>创建</th><th>到期</th><th sec:authorize="hasAnyRole('ADMIN','MODERATOR')">操作</th></tr></thead>
          <tbody>
          <tr th:each="b : ${bans}">
            <td th:text="${b.name}"></td>
            <td class="mono" th:text="${b.uuid}"></td>
            <td th:text="${b.reason}"></td>
            <td th:text="${b.source}"></td>
            <td th:text="${b.created_at}"></td>
            <td>
              <span th:if="${b.expires_at == null or b.expires_at == 0}"><span class="light-red"></span>永久</span>
              <span th:unless="${b.expires_at == null or b.expires_at == 0}" th:text="${b.expires_at}"></span>
            </td>
            <td sec:authorize="hasAnyRole('ADMIN','MODERATOR')">
              <form th:action="@{/bans/unban}" method="post" class="inline-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="hidden" name="player" th:value="${b.name}"/>
                <input type="hidden" name="uuid" th:value="${b.uuid}"/>
                <button type="submit">解封</button>
              </form>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(bans)}"><td colspan="7">当前无封禁记录</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="card" sec:authorize="hasAnyRole('ADMIN','MODERATOR')">
      <div class="card-title">封禁 IP</div>
      <div class="card-body">
        <form th:action="@{/bans/ip/ban}" method="post" class="inline-form">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <input name="ip" placeholder="IP 地址" required/>
          <input name="reason" placeholder="原因" maxlength="200"/>
          <button type="submit" class="danger">封禁 IP</button>
        </form>
      </div>
    </div>
    <div class="card">
      <div class="card-title">IP 封禁名单</div>
      <div class="card-body">
        <table>
          <thead><tr><th>IP</th><th>原因</th><th>来源</th><th>创建</th><th>到期</th><th sec:authorize="hasAnyRole('ADMIN','MODERATOR')">操作</th></tr></thead>
          <tbody>
          <tr th:each="b : ${ipBans}">
            <td class="mono" th:text="${b.ip}"></td>
            <td th:text="${b.reason}"></td>
            <td th:text="${b.source}"></td>
            <td th:text="${b.created_at}"></td>
            <td th:text="${b.expires_at == null or b.expires_at == 0 ? '永久' : b.expires_at}"></td>
            <td sec:authorize="hasAnyRole('ADMIN','MODERATOR')">
              <form th:action="@{/bans/ip/pardon}" method="post" class="inline-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="hidden" name="ip" th:value="${b.ip}"/>
                <button type="submit">解封</button>
              </form>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(ipBans)}"><td colspan="6">暂无 IP 封禁</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
