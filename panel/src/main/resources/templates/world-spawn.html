<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('出生点 - ES+')}"></head>
<body>
<div th:replace="~{fragments/layout :: top}"></div>
<div class="container">
  <div th:replace="~{fragments/layout :: sidebar('world-spawn')}"></div>
  <main class="main-content">
    <div class="page-heading"><h2>出生点</h2><p>世界出生点 + 强制玩家重生点（forced spawnpoint）。</p></div>
    <p th:if="${msg == 'queued' or msg == 'player_queued'}" class="flash-ok">已提交。</p>
    <p th:if="${err != null}" class="flash-err">失败。</p>
    <div class="card">
      <div class="card-title">当前世界出生点</div>
      <div class="card-body kv-grid">
        <div class="k">坐标</div><div class="v mono" th:text="|${runtime.spawn_x ?: '-'}, ${runtime.spawn_y ?: '-'}, ${runtime.spawn_z ?: '-'}|">-</div>
        <div class="k">朝向</div><div class="v" th:text="${runtime.spawn_angle ?: 0}">0</div>
      </div>
    </div>
    <div class="card" sec:authorize="hasAnyRole('ADMIN','MODERATOR')">
      <div class="card-title">设置世界出生点</div>
      <div class="card-body">
        <form th:action="@{/world/spawn}" method="post" class="mod-form">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <div class="form-row"><label class="field-cap">X</label><input type="number" step="1" name="x" th:value="${runtime.spawn_x ?: 0}" required/></div>
          <div class="form-row"><label class="field-cap">Y</label><input type="number" step="1" name="y" th:value="${runtime.spawn_y ?: 64}" required/></div>
          <div class="form-row"><label class="field-cap">Z</label><input type="number" step="1" name="z" th:value="${runtime.spawn_z ?: 0}" required/></div>
          <div class="form-row"><label class="field-cap">朝向</label><input type="number" step="0.1" name="angle" th:value="${runtime.spawn_angle ?: 0}"/></div>
          <button type="submit">应用</button>
        </form>
      </div>
    </div>
    <div class="card" sec:authorize="hasAnyRole('ADMIN','MODERATOR')">
      <div class="card-title">强制玩家重生点 → 世界出生点</div>
      <div class="card-body">
        <table>
          <thead><tr><th>玩家</th><th>操作</th></tr></thead>
          <tbody>
          <tr th:each="p : ${online}">
            <td th:text="${p.name}"></td>
            <td class="dense-actions">
              <form th:action="@{/world/spawn/player}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="hidden" name="player" th:value="${p.name}"/>
                <input type="hidden" name="uuid" th:value="${p.uuid}"/>
                <input type="hidden" name="mode" value="world"/>
                <button type="submit">绑定世界出生点</button>
              </form>
              <form th:action="@{/world/spawn/player}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="hidden" name="player" th:value="${p.name}"/>
                <input type="hidden" name="uuid" th:value="${p.uuid}"/>
                <input type="hidden" name="mode" value="here"/>
                <button type="submit">绑定当前位置</button>
              </form>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(online)}"><td colspan="2">无在线玩家</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
