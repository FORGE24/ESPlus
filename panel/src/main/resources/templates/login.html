<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('登录 - ES+')}"></head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="card-title">ES+ 管理控制台</div>
    <div class="card-body">
      <p class="hint">安全套件后台 · 请使用配置的管理员 / 版主 / 只读账号登录</p>
      <p th:if="${param.error}" class="flash-err" th:unless="${locked}">用户名或密码错误。</p>
      <p th:if="${locked}" class="flash-err">登录失败次数过多，账户已临时锁定约 15 分钟。</p>
      <form th:action="@{/login}" method="post">
        <label>用户名<input type="text" name="username" autocomplete="username" required/></label>
        <label>密码<input type="password" name="password" autocomplete="current-password" required/></label>
        <button type="submit" class="btn-save">登录</button>
      </form>
    </div>
  </div>
</div>
</body>
</html>
