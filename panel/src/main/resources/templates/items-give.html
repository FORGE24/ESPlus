<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('给予物品 - ES+')}"></head>
<body>
<div th:replace="~{fragments/layout :: top}"></div>
<div class="container">
  <div th:replace="~{fragments/layout :: sidebar('give')}"></div>
  <main class="main-content">
    <div class="page-heading"><h2>给予物品</h2><p>仅 ADMIN。物品 ID 如 minecraft:diamond。</p></div>
    <p th:if="${msg == 'queued'}" class="flash-ok">已提交 give。</p>
    <p th:if="${msg == 'approval'}" class="flash-ok">数量达到阈值，已提交审批工单，请到「操作审批」处理。</p>
    <p th:if="${err != null}" class="flash-err">提交失败。</p>
    <div class="card" sec:authorize="hasRole('ADMIN')">
      <div class="card-title">给予</div>
      <div class="card-body">
        <form th:action="@{/items/give}" method="post" class="mod-form">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <div class="form-row">
            <label class="field-cap">玩家</label>
            <select name="player">
              <option value="">-- 选择在线 --</option>
              <option th:each="p : ${online}" th:value="${p.name}" th:text="${p.name}"></option>
            </select>
          </div>
          <div class="form-row"><label class="field-cap">或 UUID</label><input type="text" name="uuid"/></div>
          <div class="form-row"><label class="field-cap">物品 ID</label><input type="text" name="item" placeholder="minecraft:diamond" required/></div>
          <div class="form-row"><label class="field-cap">数量</label><input type="number" name="count" value="1" min="1" max="2304"/></div>
          <div class="form-row"><label class="field-cap">原因</label><input type="text" name="reason" placeholder="活动奖励等"/></div>
          <button type="submit">给予</button>
        </form>
      </div>
    </div>
  </main>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
