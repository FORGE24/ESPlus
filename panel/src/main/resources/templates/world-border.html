<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('世界边界 - ES+')}"></head>
<body>
<div th:replace="~{fragments/layout :: top}"></div>
<div class="container">
  <div th:replace="~{fragments/layout :: sidebar('world-border')}"></div>
  <main class="main-content">
    <div class="page-heading">
      <h2>世界边界</h2>
      <p>主世界边界当前镜像值。</p>
    </div>
    <p th:if="${msg == 'queued'}" class="flash-ok">已提交。</p>
    <p th:if="${err != null}" class="flash-err">提交失败。</p>
    <div class="card">
      <div class="card-title">当前值</div>
      <div class="card-body kv-grid">
        <div class="k">尺寸</div><div class="v" th:text="${runtime.border_size ?: 0}">0</div>
        <div class="k">中心</div><div class="v" th:text="|${runtime.border_center_x ?: 0}, ${runtime.border_center_z ?: 0}|">0,0</div>
        <div class="k">警告方块</div><div class="v" th:text="${runtime.border_warning ?: 0}">0</div>
        <div class="k">伤害/格</div><div class="v" th:text="${runtime.border_damage ?: 0}">0</div>
      </div>
    </div>
    <div class="card" sec:authorize="hasAnyRole('ADMIN','MODERATOR')">
      <div class="card-title">设置边界</div>
      <div class="card-body">
        <form th:action="@{/world/border}" method="post" class="mod-form">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <div class="form-row"><label class="field-cap">尺寸</label><input type="number" name="size" step="1" th:value="${runtime.border_size ?: 59999968}" required/></div>
          <div class="form-row"><label class="field-cap">中心 X</label><input type="number" name="centerX" step="0.1" th:value="${runtime.border_center_x ?: 0}"/></div>
          <div class="form-row"><label class="field-cap">中心 Z</label><input type="number" name="centerZ" step="0.1" th:value="${runtime.border_center_z ?: 0}"/></div>
          <div class="form-row"><label class="field-cap">警告方块</label><input type="number" name="warning" th:value="${runtime.border_warning ?: 5}"/></div>
          <div class="form-row"><label class="field-cap">伤害/格</label><input type="number" name="damage" step="0.1" th:value="${runtime.border_damage ?: 0.2}"/></div>
          <button type="submit">应用</button>
        </form>
      </div>
    </div>
  </main>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
