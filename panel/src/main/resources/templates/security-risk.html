<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('管理员风险评分 - ES+')}"></head>
<body>
<div th:replace="~{fragments/layout :: top}"></div>
<div class="container">
  <div th:replace="~{fragments/layout :: sidebar('risk')}"></div>
  <main class="main-content">
    <div class="page-heading">
      <h2>管理员行为风险评分</h2>
      <p>基于过去 7 天 global_events 的 UEBA-lite 聚合（sudo / give / gamerule / 凌晨操作）。</p>
    </div>
    <p th:if="${msg}" class="flash-ok">已重新计算。</p>
    <form th:action="@{/security/risk/recompute}" method="post" class="inline-form">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <button type="submit">重新计算</button>
    </form>
    <div class="grid">
      <div class="stat"><div class="label">待审批</div><div class="value" th:text="${pendingApprovals}">0</div></div>
    </div>
    <div class="card">
      <div class="card-title">风险榜</div>
      <div class="card-body">
        <table>
          <thead><tr><th>玩家</th><th>分数</th><th>因子</th><th>建议</th><th>更新</th></tr></thead>
          <tbody>
          <tr th:each="s : ${scores}">
            <td th:text="${s.actor_name}"></td>
            <td th:text="${s.score}"></td>
            <td class="mono" th:text="${s.factors_json}"></td>
            <td th:text="${s.suggestion}"></td>
            <td th:text="${s.updated_at}"></td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
