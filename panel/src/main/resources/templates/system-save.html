<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('保存与流畅 - ES+')}"></head>
<body>
<div th:replace="~{fragments/layout :: top}"></div>
<div class="container">
  <div th:replace="~{fragments/layout :: sidebar('save')}"></div>
  <main class="main-content">
    <div class="page-heading"><h2>保存与流畅</h2><p>save-all / save-on / save-off。</p></div>
    <p th:if="${msg == 'queued'}" class="flash-ok">已提交 save-all。</p>
    <p th:if="${msg == 'on'}" class="flash-ok">已提交 save-on。</p>
    <p th:if="${msg == 'off'}" class="flash-ok">已提交 save-off。</p>
    <p th:if="${err != null}" class="flash-err">失败。</p>
    <div class="card" sec:authorize="hasRole('ADMIN')">
      <div class="card-title">立即保存</div>
      <div class="card-body chip-row">
        <form th:action="@{/system/save}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <button type="submit">save-all</button>
        </form>
        <form th:action="@{/system/save-on}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <button type="submit">save-on</button>
        </form>
        <form th:action="@{/system/save-off}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <button type="submit" class="danger">save-off</button>
        </form>
      </div>
    </div>
  </main>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
