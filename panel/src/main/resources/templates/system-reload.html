<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('重载 - ES+')}"></head>
<body>
<div th:replace="~{fragments/layout :: top}"></div>
<div class="container">
  <div th:replace="~{fragments/layout :: sidebar('reload')}"></div>
  <main class="main-content">
    <div class="page-heading"><h2>重载</h2></div>
    <div class="warn-box">执行 /reload 可能导致卡顿或插件/数据包异常。请输入 RELOAD 确认。</div>
    <p th:if="${msg == 'queued'}" class="flash-ok">已提交重载。</p>
    <p th:if="${err == 'confirm'}" class="flash-err">确认词不正确。</p>
    <p th:if="${err == 'failed'}" class="flash-err">提交失败。</p>
    <div class="card" sec:authorize="hasRole('ADMIN')">
      <div class="card-title">确认重载</div>
      <div class="card-body">
        <form th:action="@{/system/reload}" method="post" class="mod-form">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <div class="form-row"><label class="field-cap">确认词</label><input type="text" name="confirm" placeholder="RELOAD" required/></div>
          <button type="submit" class="danger">执行 reload</button>
        </form>
      </div>
    </div>
  </main>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
