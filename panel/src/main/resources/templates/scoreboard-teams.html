<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('队伍管理 - ES+')}"></head>
<body>
<div th:replace="~{fragments/layout :: top}"></div>
<div class="container">
  <div th:replace="~{fragments/layout :: sidebar('teams')}"></div>
  <main class="main-content">
    <div class="page-heading"><h2>队伍管理</h2><p>创建 / 删除 / 颜色 / 友伤 / 加入玩家。</p></div>
    <p th:if="${msg == 'queued'}" class="flash-ok">已提交。</p>
    <p th:if="${err != null}" class="flash-err">失败。</p>
    <meta http-equiv="refresh" content="10"/>
    <div class="card" sec:authorize="hasAnyRole('ADMIN','MODERATOR')">
      <div class="card-title">创建队伍</div>
      <div class="card-body">
        <form th:action="@{/scoreboard/teams/create}" method="post" class="mod-form">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <div class="form-row"><label class="field-cap">名称</label><input name="name" required pattern="[A-Za-z0-9_]+"/></div>
          <div class="form-row"><label class="field-cap">显示名</label><input name="displayName"/></div>
          <div class="form-row"><label class="field-cap">颜色</label>
            <select name="color"><option>white</option><option>red</option><option>blue</option><option>green</option><option>yellow</option><option>gold</option><option>aqua</option></select>
          </div>
          <div class="form-row"><label class="field-cap">友伤</label>
            <select name="friendlyFire"><option value="true">true</option><option value="false">false</option></select>
          </div>
          <button type="submit">创建</button>
        </form>
      </div>
    </div>
    <div class="card" sec:authorize="hasAnyRole('ADMIN','MODERATOR')">
      <div class="card-title">加入 / 离开</div>
      <div class="card-body">
        <form th:action="@{/scoreboard/teams/join}" method="post" class="inline-form" style="margin-bottom:12px">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <input name="team" placeholder="队伍名" required/>
          <select name="player"><option th:each="p : ${online}" th:value="${p.name}" th:text="${p.name}"></option></select>
          <button type="submit">加入</button>
        </form>
        <form th:action="@{/scoreboard/teams/leave}" method="post" class="inline-form">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <select name="player"><option th:each="p : ${online}" th:value="${p.name}" th:text="${p.name}"></option></select>
          <button type="submit">离开队伍</button>
        </form>
      </div>
    </div>
    <div class="card">
      <div class="card-title">队伍列表</div>
      <div class="card-body">
        <table>
          <thead><tr><th>名称</th><th>显示</th><th>颜色</th><th>友伤</th><th>成员</th><th sec:authorize="hasAnyRole('ADMIN','MODERATOR')">操作</th></tr></thead>
          <tbody>
          <tr th:each="t : ${teams}">
            <td class="mono" th:text="${t.name}"></td>
            <td th:text="${t.display_name}"></td>
            <td th:text="${t.color}"></td>
            <td th:text="${t.friendly_fire == 1 ? '开' : '关'}"></td>
            <td th:text="${t.members}"></td>
            <td class="dense-actions" sec:authorize="hasAnyRole('ADMIN','MODERATOR')">
              <form th:action="@{/scoreboard/teams/modify}" method="post" class="inline-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="hidden" name="team" th:value="${t.name}"/>
                <input type="hidden" name="option" value="friendlyFire"/>
                <input type="hidden" name="value" th:value="${t.friendly_fire == 1 ? 'false' : 'true'}"/>
                <button type="submit">切换友伤</button>
              </form>
              <form th:action="@{/scoreboard/teams/remove}" method="post" onsubmit="return confirm('删除队伍？');">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="hidden" name="name" th:value="${t.name}"/>
                <button type="submit" class="danger">删除</button>
              </form>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(teams)}"><td colspan="6">暂无队伍</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
