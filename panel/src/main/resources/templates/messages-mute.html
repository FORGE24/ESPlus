<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('禁言管理 - ES+')}"></head>
<body>
<div th:replace="~{fragments/layout :: top}"></div>
<div class="container">
  <div th:replace="~{fragments/layout :: sidebar('mute')}"></div>
  <main class="main-content">
    <div class="page-heading"><h2>禁言管理</h2><p>写入 SQLite，游戏服聊天事件即时拦截。until=0 表示永久。</p></div>
    <p th:if="${msg != null}" class="flash-ok">已更新。</p>
    <p th:if="${err != null}" class="flash-err">失败。</p>
    <div class="card" sec:authorize="hasAnyRole('ADMIN','MODERATOR')">
      <div class="card-title">添加禁言</div>
      <div class="card-body">
        <form th:action="@{/messages/mute}" method="post" class="mod-form">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <div class="form-row">
            <label class="field-cap">在线玩家</label>
            <select name="uuid" onchange="var o=this.options[this.selectedIndex]; document.getElementById('muteName').value=o.text==='选择…'?'':o.text">
              <option value="">选择…</option>
              <option th:each="p : ${online}" th:value="${p.uuid}" th:text="${p.name}"></option>
            </select>
          </div>
          <div class="form-row"><label class="field-cap">玩家名</label><input id="muteName" name="player" placeholder="或直接填写"/></div>
          <div class="form-row"><label class="field-cap">分钟</label><input type="number" name="minutes" value="60" min="0"/><span class="hint">0=永久</span></div>
          <div class="form-row"><label class="field-cap">原因</label><input name="reason" maxlength="200"/></div>
          <button type="submit" class="danger">禁言</button>
        </form>
      </div>
    </div>
    <div class="card">
      <div class="card-title">当前禁言</div>
      <div class="card-body">
        <table>
          <thead><tr><th>键</th><th>名称</th><th>原因</th><th>到期</th><th sec:authorize="hasAnyRole('ADMIN','MODERATOR')">操作</th></tr></thead>
          <tbody>
          <tr th:each="m : ${mutes}">
            <td class="mono" th:text="${m.key}"></td>
            <td th:text="${m.name}"></td>
            <td th:text="${m.reason}"></td>
            <td th:text="${m.until_label ?: (m.until_ts == 0 ? '永久' : m.until_ts)}"></td>
            <td sec:authorize="hasAnyRole('ADMIN','MODERATOR')">
              <form th:action="@{/messages/mute/unmute}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="hidden" name="key" th:value="${m.key}"/>
                <button type="submit">解除</button>
              </form>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(mutes)}"><td colspan="5">暂无禁言</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
